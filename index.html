<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter Using HTML CSS and Javascript</title>
  <style>
   body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f4f8;
}

.container {
    text-align: center;
    border-radius: 10px;
    padding: 20px;
    border: 2px solid #ccc;
    background-color: #fff;
}

.counter {
    font-size: 2em;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    font-size: 1em;
    margin: 5px;
    cursor: pointer;
}

.clicks {
    font-size: 1.1em;
    margin-top: 10px;
}
  </style>
 </head>
 <body>
    <div class="container">
    <div class="counter"> Count: <span id="count">0</span> </div>
    <div>
      <button onclick="inc()">Increment</button>
      <button onclick="dec()">Decrement</button>
    </div>
    <div class="clicks">
      <p>Clicks of Increment: <span id="incCount">0</span></p>
      <p>Clicks of Decrement: <span id="decCount">0</span></p>
    </div>
  </div>

   <script>
    let c = 0;
    let ci = 0;
    let cd = 0;
    const count = document.getElementById('count');
    const incCount = document.getElementById("incCount");
    const decCount = document.getElementById("decCount");

    function inc(){
    c = (c >= 10) ? 0 : c + 1;
    ci = (ci >= 10) ? 0 : ci + 1;
    update();
    }

    function dec(){
    c = (c > 0) ? c - 1 : 0;
    cd = (cd >= 10) ? 0 : cd + 1;
    update();
    }
    
    function update(){
    incCount.textContent = ci;
    decCount.textContent = cd;
    count.textContent = c;
    }
  </script>
</body>
</html>
