<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter Using HTML CSS and Javascript</title>
 </head>
 <body>
    <div class="container">
    <div class="counter"> Count: <span id="count">0</span> </div>
    <div>
      <button onclick="inc()">Increment</button>
      <button onclick="dec()">Decrement</button>
    </div>
    <div class="clicks">
      <p>Clicks of Increment: <span id="incCount">0</span></p>
      <p>Clicks of Decrement: <span id="decCount">0</span></p>
    </div>
  </div>
</body>
</html>
